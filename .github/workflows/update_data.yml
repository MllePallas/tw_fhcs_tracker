name: Update Financial Holdings Data

on:
  # 每月 8-20 日，台灣時間 07:07、16:07、19:07 各跑一次（UTC 前日 23:07 / 08:07 / 11:07）
  # 07:07 那跑的目的：接前一晚的新聞週期（工商／經濟日報傍晚到凌晨的線上稿）與 FVOCI，讓上班時資料已補齊；
  #   GitHub cron 以 UTC 計日，台北 07:07 = UTC 前一日 23:07，故日期範圍寫 7-19 才等於台北 8-20
  # 8 日起跑：玉山／國票／永豐固定 5-10 日公告（早鳥），其餘 10 家 11-15 日；115 年整體較 114 年晚約 3 天，尾端延至 20 日以補後續新聞
  # 分鐘刻意避開 :00（GitHub 排程整點最容易延遲 10-30 分鐘）
  # 撲空不花錢：main.py 只對有公告的家呼叫 LLM；前端已對部分月份做好呈現（缺的家顯示待更新、<10 家不排名）
  # 金額擷取仍採增量；收齊後持續補新聞與 FVOCI，月報由後續工作流程產出
  schedule:
    - cron: '7 8,11 8-20 * *'   # 台北 16:07、19:07，補抓後續新聞至20日
    - cron: '7 23 7-19 * *'     # 台北 07:07（UTC 前一日）

  # 允許手動觸發
  workflow_dispatch:
    inputs:
      target_month:
        description: '目標月份（西元年/月，例如 2026/03）；留空則自動判斷'
        required: false
        default: ''
      stock_codes:
        description: '指定公司代號，空格分隔（例如 2881 2882）；留空則爬取全部'
        required: false
        default: ''
      enable_llm:
        description: '是否啟用 LLM 兜底解析（true/false）'
        required: false
        default: 'true'
      force_refresh:
        description: '強制重爬已成功的金控（不影響新聞/FVOCI；true/false）'
        required: false
        default: 'false'

concurrency:
  group: finhold-data-write
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 允許 push 到 repo

    steps:
      # ── 1. Checkout ──────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── 3. Python 環境 ───────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt

      # ── 4. 執行爬蟲 ──────────────────────────────────
      - name: Run scraper
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TARGET_MONTH: ${{ inputs.target_month }}
          STOCK_CODES: ${{ inputs.stock_codes }}
          ENABLE_LLM: ${{ inputs.enable_llm }}
          FORCE_REFRESH: ${{ inputs.force_refresh }}
        run: |
          cd scraper

          ARGS=()
          if [ -n "$TARGET_MONTH" ]; then ARGS+=(--month "$TARGET_MONTH"); fi
          if [ -n "$STOCK_CODES" ]; then
            read -ra CODES <<< "$STOCK_CODES"
            ARGS+=(--codes "${CODES[@]}")
          fi
          if [ "$ENABLE_LLM" = "false" ]; then ARGS+=(--no-llm); fi
          if [ "$FORCE_REFRESH" = "true" ]; then ARGS+=(--force); fi
          python main.py "${ARGS[@]}"

      # ── 4b. 補上新聞摘要（每家公告即可跑，不需等 13 家收齊）──
      # 兩腳本皆冪等 + 有上限重試（無相關說明 retry 上限 3 次），增量處理
      # 用 always() 確保 scraper 即使 exit 1（部分失敗）也仍會嘗試補新聞
      - name: Generate news summaries
        if: always()
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TARGET_MONTH: ${{ inputs.target_month }}
        run: |
          ARGS=()
          if [ -n "$TARGET_MONTH" ]; then ARGS+=(--period "$TARGET_MONTH"); fi
          python scraper/news_summary.py "${ARGS[@]}"

      # ── 4c. 補上壽險 FVOCI 調整後獲利（每家公告即可跑）──
      - name: Generate FVOCI adjustment
        if: always()
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TARGET_MONTH: ${{ inputs.target_month }}
        run: |
          ARGS=()
          if [ -n "$TARGET_MONTH" ]; then ARGS+=(--period "$TARGET_MONTH"); fi
          python scraper/fvoci_adjustment.py "${ARGS[@]}"

      # ── 5. 提交更新的資料 ─────────────────────────────
      # always() 確保部分失敗時仍會推上已成功的家（main.py 在 sys.exit(1) 之前已 save_data，JSON 是 consistent 狀態）
      - name: Commit updated data
        if: always()
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add docs/data/
          # 如果沒有變更就跳過
          git diff --staged --quiet || git commit -m "chore: update financial data $(date +'%Y-%m-%d %H:%M')"
          git pull --rebase
          git push

      # ── 6. 失敗通知（可選）────────────────────────────
      - name: Report failure
        if: failure()
        run: |
          echo "❌ Scraping failed! Check the logs above."
