name: Evaluate DeepSeek Monthly Report

on:
  workflow_dispatch:
    inputs:
      periods:
        description: '測試月份，以逗號分隔；預設 2026/06–08'
        default: '2026/06,2026/07,2026/08'
        required: true
        type: string

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install report dependency
        run: pip install 'anthropic>=0.28,<1' 'requests>=2.31,<3' 'beautifulsoup4>=4.12,<5'
      - name: Generate unpublished June-August comparisons
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          REPORT_PERIODS: ${{ inputs.periods }}
        run: python scraper/evaluate_deepseek_report.py
      - name: Save comparison drafts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deepseek-report-comparison
          path: .test-output/deepseek-evaluation/
          if-no-files-found: warn
          retention-days: 14
