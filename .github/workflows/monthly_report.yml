name: Publish Approved Monthly Analysis

on:
  push:
    branches: [main]
    paths:
      - 'docs/reports/*.md'
  workflow_dispatch:
    inputs:
      period:
        description: '重新排版已核准的 Markdown；西元月份 YYYY/MM'
        required: true
        type: string

concurrency:
  group: finhold-data-write
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: pip install 'anthropic>=0.28,<1' 'requests>=2.31,<3' 'beautifulsoup4>=4.12,<5'
      - name: Verify calculations and report publishing
        run: |
          node tests/analytics.test.cjs
          node tests/analysis-pack.test.cjs
          python -m unittest discover -s tests -p 'test_*.py'
      - name: Render approved report files without AI
        env:
          REPORT_PERIOD: ${{ inputs.period }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          periods=()
          if [ "${{ github.event_name }}" = 'workflow_dispatch' ]; then
            periods+=("$REPORT_PERIOD")
          else
            mapfile -t files < <(git diff --name-only --diff-filter=AM "$BEFORE_SHA" "$AFTER_SHA" -- 'docs/reports/*.md')
            for file in "${files[@]}"; do
              stem="${file##*/}"
              stem="${stem%.md}"
              if [[ "$stem" =~ ^20[0-9]{2}-(0[1-9]|1[0-2])$ ]]; then periods+=("${stem:0:4}/${stem:5:2}"); fi
            done
          fi
          for period in "${periods[@]}"; do
            if [[ ! "$period" =~ ^20[0-9]{2}/(0[1-9]|1[0-2])$ ]]; then echo "Invalid report period: $period"; exit 1; fi
            stem="${period:0:4}-${period:5:2}"
            if [ ! -f "docs/reports/$stem.md" ]; then echo "Approved Markdown missing: $stem.md"; exit 1; fi
            python scraper/monthly_report.py --period "$period" --no-ai
          done
      - name: Save rendered reports
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add docs/reports/
          if ! git diff --staged --quiet; then
            git commit -m 'chore: render approved monthly analysis'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Run summary
        run: |
          echo 'Only submitted Markdown reports were rendered; no AI analysis was generated.' >> "$GITHUB_STEP_SUMMARY"
